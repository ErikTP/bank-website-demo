                    <a href="index.html">Hem</a>

                    <i class="fa fa-bars"></i>

    <script>
        function myFunction() {
      var x = document.getElementById("myLinks");
      if (x.style.display === "block") {
        x.style.display = "none";
      } else {
        x.style.display = "block";
      }
    } 
    </script>

     <div class="title-wrapper">
        <h1>Välkommen till banken!</h1>
        <p>Din pålitliga partner för finansiella tjänster!</p>
     </div>

    <div class="top-image top-image-contact">
    </div>

    </header>
    
    <main class="inner-wrapper">

        <section class="kontakt-section" aria-labelledby="kontakt-formular">

            <div class="box-container-tjanster">

                <div class="box">

                    <form action="/action_page.php">

                        <label for="fname">Förnamn <span aria-hidden="true">*</span></label>
                        <input type="text" id="fname" name="firstname" placeholder="Din förnamn..">
                    
                        <label for="lname">Efternamn <span aria-hidden="true">*</span></label>
                        <input type="text" id="lname" name="lastname" placeholder="Ditt efternamn.." aria-required="true">
                    
                        <label for="ename">E-post <span aria-hidden="true">*</span></label>
                        <input type="text" id="ename" name="e-post" placeholder="Din e-post.." aria-required="true">
                    
                        <label for="country">Land</label>
                        <select id="country" name="country">
                            <option value="australia">Sverige</option>
                            <option value="canada">Danmark</option>
                            <option value="usa">Norge</option>
                        </select>
                    
                        <label for="subject">Meddelande</label>
                        <textarea id="subject" name="subject" placeholder="Skriv något.."></textarea>
                    
                        <input type="submit" value="Skicka" aria-label="Skicka formuläret">

                    </form>

                </div>
        
            </div>

        </section>

    </main>

    <footer>
        <p>© 2024 Banken. Alla rättigheter förbehållna.</p>
    </footer>
