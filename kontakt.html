<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Välkommen att kontakta oss på Banken.">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/reset.css" />
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <title>Banken</title>
</head>
<body>

    <header> 
     <nav>
        <ul class="navigation" aria-label="Huvudnavigation">
            <li class="navlink"><a href="index.html">Hem</a></li>
            <li class="navlink"><a href="om-oss.html">Om oss</a></li>
            <li class="navlink"><a href="tjanster.html">Tjänster</a></li>
            <li class="navlink"><a href="kontakt.html">Kontakt</a></li>
            <li class="navlink"><a href="faq.html">FAQ</a></li>
        <div class="hamburgare"> 
            <img
                src="hamburgarmeny.png"
                alt="Hamburgarmeny för navigation"
                aria-label="Klicka på hamburgarmeny för att navigera">
        </div>
        </ul>
     </nav>

     <div class="title-wrapper">
        <h1>Kontakta oss</h1>
        <p>Vänligen fyll i formuläret.</p>
     </div>

     <div class="top-image top-image-contact">
    </div>

    </header>
    
    <main class="inner-wrapper">

        <section class="kontakt-section" aria-labelledby="kontakt-formular">

            <div class="box-container-tjanster">

                <div class="box">

                    <form action="/action_page.php">

                        <label for="fname">Förnamn <span aria-hidden="true">*</span></label>
                        <input type="text" id="fname" name="firstname" placeholder="Din förnamn..">
                    
                        <label for="lname">Efternamn <span aria-hidden="true">*</span></label>
                        <input type="text" id="lname" name="lastname" placeholder="Ditt efternamn.." aria-required="true">
                    
                        <label for="ename">E-post <span aria-hidden="true">*</span></label>
                        <input type="text" id="ename" name="e-post" placeholder="Din e-post.." aria-required="true">
                    
                        <label for="country">Land</label>
                        <select id="country" name="country">
                            <option value="australia">Sverige</option>
                            <option value="canada">Danmark</option>
                            <option value="usa">Norge</option>
                        </select>
                    
                        <label for="subject">Meddelande</label>
                        <textarea id="subject" name="subject" placeholder="Skriv något.."></textarea>
                    
                        <input type="submit" value="Skicka" aria-label="Skicka formuläret">

                    </form>

                </div>
        
            </div>

        </section>

    </main>

    <footer>
        <p>© 2024 Banken. Alla rättigheter förbehållna.</p>
    </footer>
    
</body>
</html>
